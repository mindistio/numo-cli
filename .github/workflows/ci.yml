name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Both ends, because this one is published: 22 is the floor engines.node
        # promises and build.mjs compiles to, 24 is what .nvmrc pins and what releases
        # are cut on. A floor nothing runs is a claim, not support.
        #
        # Written out rather than read from a file, and that is the difference between
        # this job and every other setup-node in these repos: those pick ONE version and
        # so can read it from the pin, while this one exists precisely to run the two
        # that no single field names.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify binary runs
        run: node dist/cli.cjs --version

      - name: Test
        run: npm test
